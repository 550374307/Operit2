name: Android Build (Linux Host)

# Builds the Android APK on a Linux runner.
#
# The upstream `android-flutter-build.yml` builds the APK on windows-2025.
# That cannot work for source-built V8: the `v8` crate's build script runs
# `gn gen`, and Chromium's //build/config/BUILDCONFIG.gn asserts
#   assert(host_os == "linux", "Android builds are only supported on Linux.")
# so :app:prepareOperitAndroidV8arm64v8a panics with
#   Android V8 preparation failed: ... returned non-zero exit status 101
# on any non-Linux host. See docs in tools/build_scripts/prepare_android_v8.py,
# which itself only supports HOST_TAG == linux-x86_64 for the NDK fallback.
#
# This workflow reuses the same runtime job as upstream and only moves the APK
# job to ubuntu-24.04.

on:
  workflow_dispatch:
    inputs:
      build_module:
        description: "Also build the Android module package"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            diffutils \
            flex \
            gawk \
            gzip \
            patch \
            pkg-config \
            tar \
            unzip \
            xz-utils

      - name: Cache Android runtime sources
        uses: actions/cache@v4
        with:
          # samba.org (talloc) answers 503/504 under load and has no upstream
          # CDN mirror, so every cold run is a coin flip. Cache the verified
          # source tarballs instead: once one run succeeds, later runs do not
          # touch the fragile origins at all.
          path: tools/android-runtime/downloads
          key: ${{ runner.os }}-android-runtime-src-${{ hashFiles('tools/android-runtime/fetch_sources.ps1') }}
          restore-keys: |
            ${{ runner.os }}-android-runtime-src-

      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 1

  build-android:
    needs: build-android-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: apps/flutter/app/android/app/src/main

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            git \
            libc6-dev \
            libssl-dev \
            lld \
            ninja-build \
            pkg-config \
            python3-full \
            python3-venv \
            unzip \
            xz-utils

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache-linux

      - name: Install plugin build tools
        run: |
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          corepack enable

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Configure git for flaky external hosts
        run: |
          # pubspec.yaml pulls path_provider_ohos and url_launcher_ohos from
          # https://gitee.com/openharmony-sig/flutter_packages.git. Those are
          # OpenHarmony-only packages but `flutter pub get` still clones the
          # repository, and GitHub's US-hosted runners frequently lose the TLS
          # session to gitee.com:
          #   error: RPC failed; curl 56 GnuTLS recv error (-110)
          #   fatal: early EOF
          # lower the HTTP/2 framing layer risk and retry instead of failing the
          # whole resolution on the first dropped packet.
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 300
          git config --global core.compression 0
          # Retry transient git failures. GitHub-hosted runners ship git 2.4x,
          # which does not understand `git retry`, so wrap the clone/flush via
          # the pub client's own retry knob below instead.
          echo "Git transport tuned for HTTP/1.1 with a large post buffer."

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Cache pub dependencies (including gitee git checkouts)
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache/git
            ~/.pub-cache/hosted
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('apps/flutter/app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Install Android NDK for V8 source build
        run: |
          # rusty_v8 needs an NDK r23+; reuse the one the runtime job cached so
          # the APK job does not download it a second time.
          ndk_root="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          if [ ! -d "$ndk_root" ]; then
            bash tools/android-runtime/fetch_ndk_wsl.sh
          fi
          echo "OPERIT_ANDROID_V8_NDK=$ndk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_root" >> "$GITHUB_ENV"

      - name: Install libclang 21 for bindgen
        run: |
          # prepare_android_v8.py's find_libclang() scans /usr/lib/llvm*/lib for
          # libclang.so.21+ on Linux. Ubuntu 24.04 ships llvm-18, so pull
          # libclang-21 from apt.llvm.org.
          #
          # Do NOT set OPERIT_ANDROID_V8_LLVM here: that variable overrides the
          # host toolchain in find_host_clang() and must point at an LLVM root
          # containing bin/clang. Leaving it unset is the intended Linux
          # behaviour -- GN then downloads Chromium's hermetic clang, which is
          # what provides libclang_rt.builtins.a in the layout Chromium's
          # toolchains expect. Only libclang (bindgen's parser library) needs
          # to come from apt.
          set -euo pipefail
          sudo apt-get install -y wget gnupg software-properties-common
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm21.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y libclang-21-dev libclang-common-21-dev llvm-21
          libclang_dir="$(ls -d /usr/lib/llvm-21/lib 2>/dev/null || true)"
          if [[ -z "$libclang_dir" ]] || ! ls "$libclang_dir"/libclang.so* > /dev/null 2>&1; then
            echo "installed llvm layouts:" >&2
            ls -d /usr/lib/llvm-*/lib 2>/dev/null || true
            echo "libclang 21 was not installed where prepare_android_v8.py looks" >&2
            exit 1
          fi
          echo "Using libclang from $libclang_dir"
          ls -1 "$libclang_dir"/libclang.so* 

      - name: Restore Android signing material
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" \
             || -z "${ANDROID_RELEASE_STORE_PASSWORD:-}" \
             || -z "${ANDROID_RELEASE_KEY_ALIAS:-}" \
             || -z "${ANDROID_RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "::warning::Android signing secrets are incomplete; falling back to unsigned release signing."
            echo "OPERIT_ANDROID_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
            exit 0
          fi
          secrets_dir="tools/release/secrets"
          mkdir -p "$secrets_dir"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d \
            > "$secrets_dir/operit2-release.keystore"
          {
            echo "RELEASE_STORE_FILE=operit2-release.keystore"
            echo "RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD"
          } > "$secrets_dir/android-signing.properties"
          echo "Release keystore restored for signing."

      - name: Cache source-built Android V8
        uses: actions/cache@v4
        with:
          path: tools/release/work/android-v8
          key: ${{ runner.os }}-${{ runner.arch }}-android-v8-${{ hashFiles('tools/build_scripts/prepare_android_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          # repo.maven.apache.org throttles GitHub's shared runner IPs with 429,
          # so keep the resolved artifacts between runs and cut the number of
          # network hits on a cold Gradle Home.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/flutter/app/android/**/*.gradle*', 'apps/flutter/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Route Maven resolution through the mirror on CI
        run: |
          # repo.maven.apache.org answers 429 Too Many Requests for GitHub's
          # shared runner IPs, and plugins.gradle.org redirects there:
          #
          #   Could not GET 'https://plugins.gradle.org/m2/.../kotlin-stdlib-2.0.21.pom'
          #     > Could not GET 'https://repo.maven.apache.org/maven2/...' 429
          #
          # Ordering alone cannot fix this: Gradle aborts the module on a 4xx
          # instead of falling through to the next repository, and the mirror
          # that would have answered sits behind the entry that redirects to the
          # throttled host. Drop the throttled repositories from the chain
          # entirely and rely on maven.aliyun.com, whose "public" repository
          # mirrors Maven Central, with dl.google.com kept for Google artifacts.
          # This is a CI-only init script; project build files stay untouched.
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/ci-repositories.gradle" <<'GRADLE'
          def THROTTLED_PREFIXES = [
              'repo.maven.apache.org',   // serves 429 to shared runner IPs
              'repo1.maven.org',         // alias of the same host
              'plugins.gradle.org',      // redirects into repo.maven.apache.org
          ]
          def MIRRORS = [
              'https://maven.aliyun.com/repository/gradle-plugin',  // plugin markers
              'https://maven.aliyun.com/repository/public',         // mirrors Maven Central
          ]

          def isThrottled = { repo ->
              if (!(repo instanceof MavenArtifactRepository)) return false
              def url = repo.url.toString()
              THROTTLED_PREFIXES.any { url.contains(it) }
          }
          def isMirror = { repo ->
              if (!(repo instanceof MavenArtifactRepository)) return false
              repo.url.toString().contains('maven.aliyun.com')
          }

          def route = { RepositoryHandler repositories ->
              def removed = repositories.findAll { isThrottled(it) || isMirror(it) }
              repositories.removeAll(removed)
              // Re-insert the mirrors at the front, in priority order, so Maven
              // Central artifacts resolve without touching a throttled host.
              MIRRORS.reverseEach { target ->
                  repositories.addFirst(repositories.maven { url = target })
              }
          }

          beforeSettings { settings ->
              route(settings.pluginManagement.repositories)
              route(settings.dependencyResolutionManagement.repositories)
          }

          allprojects { project ->
              route(project.buildscript.repositories)
              route(project.repositories)
          }

          println "[ci] Maven Central and the Gradle Plugin Portal are served by ${MIRRORS}"
          GRADLE
          echo "Installed Gradle init script at $HOME/.gradle/init.d/ci-repositories.gradle"

      - name: Build and package Android app
        env:
          # pub retries transient git/HTTP failures internally when these are set.
          PUB_MAX_ATTEMPTS: "5"
        run: |
          set -euo pipefail
          version_line="$(grep -cE '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+[[:space:]]*$' \
            apps/flutter/app/pubspec.yaml || true)"
          if [[ "$version_line" != "1" ]]; then
            echo "apps/flutter/app/pubspec.yaml must contain exactly one release version line" >&2
            exit 1
          fi
          build_name="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+[[:space:]]*$/\1/p' \
            apps/flutter/app/pubspec.yaml)"
          build_number="$(sed -nE 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)[[:space:]]*$/\1/p' \
            apps/flutter/app/pubspec.yaml)"
          # Bash drops unset variables instead of passing an empty argument, so
          # this conditional flag cannot reproduce the PowerShell bug fixed in
          # android-flutter-build.yml (commit 2efe2a1).
          signing_args=()
          if [[ "${OPERIT_ANDROID_DEBUG_SIGNING:-}" == "true" ]]; then
            signing_args=(--skip-signing)
          fi
          python3 tools/build_scripts/build_flutter_android.py \
            --build-name "$build_name" \
            --build-number "$build_number" \
            --enforce-lockfile \
            "${signing_args[@]}"

      - name: Build and package Android module
        if: inputs.build_module
        run: python3 tools/build_scripts/build_android_module_release.py --enforce-lockfile

      - name: Verify APK signature
        run: |
          apk="$(ls tools/release/dist/operit2-app-android-arm64-v8a-*.apk | head -n 1)"
          echo "APK: $apk"
          apk_analyzer="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n 1)"
          if [[ -n "$apk_analyzer" ]]; then
            "$apk_analyzer" verify --print-certs "$apk"
          else
            echo "apksigner not found; skipping signature verification"
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-${{ github.sha }}
          path: tools/release/dist/operit2-app-android-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android module artifact
        if: inputs.build_module
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-module-${{ github.sha }}
          path: tools/release/dist/operit2-module-android-arm64-v8a-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
