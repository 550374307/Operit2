name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Release products to build"
        required: false
        default: "all"
        type: choice
        options:
          - "app"
          - "cli"
          - "all"
      cli_arches:
        description: "Windows CLI architectures"
        required: false
        default: "all"
        type: choice
        options:
          - "host"
          - "all"
          - "x86_64"
          - "aarch64"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache-windows

      - name: Install plugin build tools
        shell: pwsh
        run: |
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          corepack enable
          # emsdk's wasm-ld lives under upstream/bin; expose it for wasm plugins.
          $emsdkBin = Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Filter "wasm-ld.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($emsdkBin) {
            $emsdkDir = Split-Path -Parent $emsdkBin
            $emsdkDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            Write-Host "Added wasm-ld directory to PATH: $emsdkDir"
          } else {
            Write-Warning "wasm-ld.exe not found after emsdk setup"
          }
      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --no-progress --limit-output --yes

      - name: Cargo check operit-flutter-bridge (surface real rustc errors)
        working-directory: apps/flutter/native/operit-flutter-bridge
        shell: pwsh
        run: cargo check --locked 2>&1 | Tee-Object -FilePath cargo-check.log; if ($LASTEXITCODE -ne 0) { Get-Content cargo-check.log | Select-String -Pattern "error" | Select-Object -First 40 | ForEach-Object { $_.Line }; exit 1 }

      - name: Install .NET SDK for MSI packaging
        if: inputs.products != 'cli'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and package Windows app
        if: inputs.products != 'cli'
        shell: pwsh
        run: python tools/build_scripts/build_flutter_windows.py --enforce-lockfile

      - name: Build and package Windows CLI
        if: inputs.products != 'app'
        shell: pwsh
        run: python tools/build_scripts/build_cli_windows.py --arches "${{ inputs.cli_arches }}"

      - name: Upload Windows app artifact
        if: inputs.products != 'cli'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-windows-app-${{ github.sha }}
          path: tools/release/dist/operit2-app-windows-x86_64-*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows CLI artifacts
        if: inputs.products != 'app'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-windows-cli-${{ github.sha }}
          path: tools/release/dist/operit2-cli-windows-*.zip
          if-no-files-found: error
          retention-days: 14
